# Temporary: checks whether FRED (St. Louis Fed, which republishes BLS county data) answers from GitHub's runners.
name: BLS API probe
on:
  push:
    branches: [bls]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: FRED graph CSV (Harris County, TX unemployment rate)
        run: curl -sS -w "\nHTTP %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=TXHARR1URN" | tail -5
      - name: FRED API without a key (expect a 'missing api_key' error if reachable)
        run: curl -sS -w "\nHTTP %{http_code}\n" "https://api.stlouisfed.org/fred/series?series_id=TXHARR1URN&file_type=json" | head -c 400
