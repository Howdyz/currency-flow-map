# Downloads the raw IRS SOI migration CSVs and Census County Business Patterns
# (industry sectors only) and stores them, gzipped, on the irs-raw branch,
# where scripts/build_data.py picks them up.
name: Fetch source data
on:
  workflow_dispatch:
  push:
    branches: [irs-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download state and county files
        run: |
          mkdir raw && cd raw
          get() { curl -fsSL --retry 3 -A "Mozilla/5.0 (currency-flow-map data fetch)" -o "$1" "https://www.irs.gov/pub/irs-soi/$1" && echo "ok $1" || { rm -f "$1"; echo "missing $1"; }; }
          for y in 1112 1213 1314 1415 1516 1617 1718 1819 1920 2021 2122 2223 2324 2425; do
            get stateinflow$y.csv; get stateoutflow$y.csv
          done
          for y in 2021 2122 2223 2324 2425; do
            get countyinflow$y.csv; get countyoutflow$y.csv
          done
      - name: Download County Business Patterns (2-digit industry sectors)
        run: |
          cd raw
          for y in 23 22; do
            if curl -fsSL --retry 3 -A "Mozilla/5.0 (currency-flow-map data fetch)" -o cbp.zip "https://www2.census.gov/programs-surveys/cbp/datasets/20$y/cbp${y}co.zip"; then
              unzip -o -q cbp.zip && rm cbp.zip
              f=$(ls cbp${y}co.txt)
              { head -1 "$f"; grep -E '^[^,]*,[^,]*,"?([0-9]{2}----|------)"?,' "$f"; } > cbp${y}co.csv
              rm "$f"; echo "ok cbp${y}co"; break
            fi
            echo "missing cbp${y}co"
          done
      - name: List and compress
        run: |
          cd raw
          ls -la
          for f in *.csv; do echo "== $f"; head -3 "$f"; done
          gzip -9 *.csv
      - name: Commit to irs-raw
        run: |
          cd raw
          git init -q -b irs-raw
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Raw IRS SOI migration CSVs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" irs-raw
